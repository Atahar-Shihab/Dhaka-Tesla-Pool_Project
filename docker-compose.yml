# ============================================
# Dhaka Tesla Pool - Docker Compose
# ============================================
# Run: docker compose up --build
# This starts the database, backend API, and frontend

version: "3.8"

services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: dhaka-tesla-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dhaka_tesla_pool}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Backend API (Node.js + Express) ----
  server:
    build: ./server
    container_name: dhaka-tesla-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-dhaka_tesla_pool}
      JWT_SECRET: ${JWT_SECRET:-dhaka-tesla-pool-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 5000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             node prisma/seed.js &&
             node src/app.js"

  # ---- Frontend (React + Vite) ----
  client:
    build: ./client
    container_name: dhaka-tesla-client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
